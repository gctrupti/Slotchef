[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotchef-optimizer"
version = "0.1.0"
description = "Independent OR-Tools CP-SAT scheduling engine for SlotChef"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.12,<10.0",
]

[tool.setuptools.packages.find]
include = ["slotchef_optimizer*"]

