services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./optimizer:/app/optimizer
    depends_on:
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app/backend
      - ./optimizer:/app/optimizer
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  # Optional local PostgreSQL for offline portability testing only:
  #   docker compose --profile local-db up -d
  postgres:
    profiles: ["local-db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slotchef}
      POSTGRES_USER: ${POSTGRES_USER:-slotchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotchef}
    ports:
      - "5432:5432"
    volumes:
      - slotchef_pgdata:/var/lib/postgresql/data

volumes:
  slotchef_pgdata:

