components:
  schemas:
    AccountRestriction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        user_email:
          type: string
          readOnly: true
        incident:
          type: string
          format: uuid
          nullable: true
        restriction_type:
          $ref: '#/components/schemas/RestrictionTypeEnum'
        reason:
          type: string
        is_active:
          type: boolean
          readOnly: true
        imposed_by:
          type: string
          format: uuid
          readOnly: true
        imposed_by_email:
          type: string
          readOnly: true
        lifted_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        lift_reason:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - imposed_by
      - imposed_by_email
      - is_active
      - lift_reason
      - lifted_by
      - reason
      - restriction_type
      - user
      - user_email
    AdminInvitationAccept:
      type: object
      description: Accept invitation and activate administrator credentials.
      properties:
        token:
          type: string
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          default: ''
        last_name:
          type: string
          default: ''
        phone:
          type: string
          default: ''
        mfa_enabled:
          type: boolean
          default: true
      required:
      - password
      - token
    AdminInvitationCreate:
      type: object
      description: Create an admin account invitation.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role_code:
          $ref: '#/components/schemas/RoleCodeEnum'
      required:
      - email
      - role_code
    AdminMFAVerify:
      type: object
      description: Complete Admin MFA step-up verification.
      properties:
        mfa_token:
          type: string
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - mfa_token
      - otp
    AvailabilityTypeEnum:
      enum:
      - regular
      - override
      type: string
      description: |-
        * `regular` - Regular
        * `override` - Override
    BackgroundVerificationStatusEnum:
      enum:
      - pending
      - clear
      - flagged
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `clear` - Clear
        * `flagged` - Flagged
        * `failed` - Failed
    BookingCreate:
      type: object
      description: Input serializer for household booking requests.
      properties:
        service_date:
          type: string
          format: date
        meal_type:
          allOf:
          - $ref: '#/components/schemas/MealTypeEnum'
          default: breakfast
        earliest_start:
          type: string
          description: HH:MM format, e.g. '07:30'
        latest_finish:
          type: string
          description: HH:MM format, e.g. '08:45'
        earliest_start_minute:
          type: integer
          maximum: 1440
          minimum: 0
        latest_finish_minute:
          type: integer
          maximum: 1440
          minimum: 0
        estimated_duration_minutes:
          type: integer
          maximum: 240
          minimum: 15
          default: 45
        required_skills:
          type: array
          items:
            type: string
        dietary_tags:
          type: array
          items:
            type: string
        notes:
          type: string
          default: ''
        priority:
          type: integer
          maximum: 3
          minimum: 1
          default: 1
      required:
      - service_date
    BookingDetail:
      type: object
      description: Detailed booking serializer with requirements, assignment, and
        conflicts.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        household:
          type: string
          format: uuid
        household_label:
          type: string
          readOnly: true
        society_id:
          type: string
          format: uuid
          readOnly: true
        service_date:
          type: string
          format: date
        earliest_start_minute:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Earliest allowed start minute (0..1440)
        latest_finish_minute:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Latest allowed finish minute (0..1440)
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        meal_type:
          $ref: '#/components/schemas/MealTypeEnum'
        priority:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Priority level (1=normal, 2=high, 3=urgent)
        status:
          allOf:
          - $ref: '#/components/schemas/BookingDetailStatusEnum'
          readOnly: true
        notes:
          type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/BookingRequirement'
          readOnly: true
        assignment:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        conflict_reasons:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        price_breakdown:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignment
      - conflict_reasons
      - created_at
      - earliest_start_minute
      - household
      - household_label
      - id
      - latest_finish_minute
      - price_breakdown
      - requirements
      - service_date
      - society_id
      - status
      - updated_at
    BookingDetailStatusEnum:
      enum:
      - DRAFT
      - PENDING
      - CONFIRMED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - UNFULFILLED
      - NEEDS_REVIEW
      - REJECTED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `IN_PROGRESS` - In Progress
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `UNFULFILLED` - Unfulfilled
        * `NEEDS_REVIEW` - Needs Review
        * `REJECTED` - Rejected
    BookingPriceBreakdown:
      type: object
      description: Detailed price breakdown serializer with snapshot metadata.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
          readOnly: true
        pricing_rule:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        commission_config:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        base_fee_minor_units:
          type: integer
          readOnly: true
        duration_fee_minor_units:
          type: integer
          readOnly: true
        meal_multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
        subtotal_minor_units:
          type: integer
          readOnly: true
        platform_commission_minor_units:
          type: integer
          readOnly: true
        cook_earnings_minor_units:
          type: integer
          readOnly: true
        tax_minor_units:
          type: integer
          readOnly: true
        discount_minor_units:
          type: integer
          readOnly: true
        total_amount_minor_units:
          type: integer
          readOnly: true
        currency:
          type: string
