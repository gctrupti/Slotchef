    Register:
      type: object
      description: User registration serializer enforcing strict role segregation
        and initial channel OTP dispatch.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        phone:
          type: string
          default: ''
        first_name:
          type: string
          default: ''
        last_name:
          type: string
          default: ''
        legal_name:
          type: string
          default: ''
