openapi: 3.0.3
info:
  title: SlotChef Backend API
  version: 1.0.0
  description: Authoritative Django REST API and OR-Tools CP-SAT scheduling backend
    for SlotChef household cooking coordination.
paths:
  /api/v1/admin/cash-collections/{cash_record_id}/resolve:
    post:
      operationId: admin_cash_collections_resolve_create
      description: Admin arbitrates and resolves disputed cash collection.
      summary: Admin resolves cash dispute (Admin only)
      parameters:
      - in: path
        name: cash_record_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashResolveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashResolveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCollectionRecord'
          description: ''
  /api/v1/admin/cooks/{id}/verification:
    post:
      operationId: admin_cooks_verification_create
      description: Review and approve or reject cook verification dossier.
      summary: Admin review cook verification dossier
      parameters:
      - in: path
