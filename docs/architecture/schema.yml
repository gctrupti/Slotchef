          description: |-
            Public registration is strictly restricted to household_member and cook roles.

            * `household_member` - household_member
            * `cook` - cook
        verification_channel:
          allOf:
          - $ref: '#/components/schemas/OTPChannelEnum'
          description: |-
            Target channel for initial registration OTP delivery (sms or email).

            * `sms` - SMS
            * `email` - Email
